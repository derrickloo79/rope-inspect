# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo, or `render blueprint launch`
services:
  - type: web
    name: rope-inspect
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    # docker-entrypoint runs db:prepare (create + migrate) on boot
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      # Paste value of config/master.key (never commit the key file)
      - key: RAILS_MASTER_KEY
        sync: false
      # Set after first deploy to your service URL, e.g. rope-inspect.onrender.com
      - key: APP_HOST
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rope-inspect-db
          property: connectionString

databases:
  - name: rope-inspect-db
    plan: free
    region: singapore
    databaseName: rope_inspect_production
    user: rope_inspect
